<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Call — Clockwork Ops</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
    <link rel="preconnect" href="https://calendly.com" crossorigin />
    <link rel="dns-prefetch" href="https://assets.calendly.com" />
    <link rel="dns-prefetch" href="https://calendly.com" />
    <link rel="preload" as="script" href="https://assets.calendly.com/assets/external/widget.js" />
    <link rel="prefetch" as="document" href="https://calendly.com/michael-clockworkops/30min?hide_gdpr_banner=1&background_color=171d28&text_color=ededef&primary_color=f5a623" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #171d28;
        --bg-2: #10131a;
        --bg-3: #161921;
        --bg-4: #1c2030;
        --border: rgba(255, 255, 255, 0.06);
        --border-mid: rgba(255, 255, 255, 0.1);
        --border-hi: rgba(255, 255, 255, 0.15);
        --text: #ededef;
        --text-mid: #8c90aa;
        --text-dim: #72768f;
        --orange: #f5a623;
        --orange-lt: #ffb84d;
        --orange-glow: rgba(245, 166, 35, 0.12);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Barlow", sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* ── BACKGROUND GRID ──────────────────────────────── */
      .bg-grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 72px 72px;
        pointer-events: none;
        z-index: 0;
      }

      /* ── NAV ──────────────────────────────────────────── */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        height: 66px;
        padding: 0 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(11, 13, 18, 0.88);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
      }

      .nav-logo {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        padding: 12px 8px;
        margin: -12px -8px;
      }
      .nav-logo img {
        height: 34px;
        width: auto;
      }
      .nav-logo-text {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.5px;
        color: var(--text);
      }
      .nav-logo-text span {
        color: var(--orange);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 38px;
        list-style: none;
      }
      .nav-links a {
        color: var(--text-mid);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.2px;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: var(--text);
      }

      /* ── BUTTONS ──────────────────────────────────────── */
      .btn {
        display: inline-block;
        font-family: "Barlow", sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.6px;
        padding: 11px 24px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.15s,
          box-shadow 0.2s;
      }
      .btn-primary {
        background: var(--orange);
        color: #0b0d12;
        clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
      }
      .btn-primary:hover {
        background: var(--orange-lt);
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(245, 166, 35, 0.3);
      }

      /* ── SHARED LAYOUT ────────────────────────────────── */
      .section-inner {
        max-width: 1220px;
        margin: 0 auto;
        padding: 0 52px;
        position: relative;
        z-index: 1;
      }

      .section-label {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.8px;
        text-transform: uppercase;
        color: var(--orange);
        margin-bottom: 18px;
      }

      /* ── SCHEDULE HERO ────────────────────────────────── */
      .schedule-hero {
        padding: 140px 52px 40px;
        max-width: 1220px;
        margin: 0 auto;
        text-align: center;
        position: relative;
        z-index: 1;
      }
      .schedule-hero h1 {
        font-size: clamp(38px, 4.8vw, 60px);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -1.5px;
        margin-bottom: 22px;
      }
      .schedule-hero h1 em {
        font-style: normal;
        color: var(--orange);
      }
      .schedule-hero p {
        font-size: 18px;
        color: var(--text-mid);
        line-height: 1.7;
        max-width: 620px;
        margin: 0 auto;
      }

      /* ── CALENDLY EMBED ───────────────────────────────── */
      .calendly-section {
        padding: 32px 24px 96px;
        position: relative;
        z-index: 1;
      }
      .calendly-wrap {
        max-width: 1100px;
        margin: 0 auto;
        border: 1px solid var(--border-mid);
        background: var(--bg-3);
        overflow: hidden;
      }
      .calendly-inline-widget {
        min-width: 320px;
        height: 720px;
      }

      /* ── FOOTER ───────────────────────────────────────── */
      footer {
        border-top: 1px solid var(--border);
        padding: 36px 52px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      .footer-logo {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-size: 18px;
        color: var(--text-mid);
        letter-spacing: 0.5px;
        display: inline-block;
        padding: 10px 12px;
        margin: -10px -12px;
        text-decoration: none;
      }
      .footer-logo span {
        color: var(--orange);
      }
      .footer-copy {
        font-size: 13px;
        color: var(--text-dim);
      }

      /* ── RESPONSIVE ───────────────────────────────────── */
      @media (max-width: 960px) {
        nav {
          padding: 0 24px;
        }
        .nav-links {
          display: none;
        }

        .schedule-hero {
          padding: 110px 24px 28px;
        }

        .calendly-section {
          padding: 24px 12px 64px;
        }
        .calendly-inline-widget {
          height: 900px;
        }

        footer {
          flex-direction: column;
          gap: 12px;
          text-align: center;
          padding: 28px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>

    <!-- ── NAV ──────────────────────────────────────────── -->
    <nav>
      <a href="../index.html" class="nav-logo">
        <span class="nav-logo-text">CLOCKWORK <span>OPS</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html#services">Services</a></li>
        <li><a href="../index.html#how-it-works">How It Works</a></li>
        <li><a href="../index.html#about">About</a></li>
      </ul>
      <a href="#calendly-embed" class="btn btn-primary">Book Free Call</a>
    </nav>

    <!-- ── SCHEDULE HERO ────────────────────────────────── -->
    <section class="schedule-hero">
      <h1>Let's talk about your <em>business.</em></h1>
    </section>

    <!-- ── CALENDLY EMBED ───────────────────────────────── -->
    <section class="calendly-section" id="calendly-embed">
      <div class="calendly-wrap">
        <div
          class="calendly-inline-widget"
          data-url="https://calendly.com/michael-clockworkops/30min?hide_gdpr_banner=1&background_color=171d28&text_color=ededef&primary_color=f5a623"
        ></div>
        <script
          type="text/javascript"
          src="https://assets.calendly.com/assets/external/widget.js"
          async
          fetchpriority="high"
        ></script>
      </div>
    </section>

    <!-- ── FOOTER ────────────────────────────────────────── -->
    <footer>
      <a href="../index.html" class="footer-logo" style="text-decoration: none;">CLOCKWORK <span>OPS</span></a>
      <p class="footer-copy">© 2026 Clockwork Ops. All rights reserved.</p>
      <div class="footer-copy" style="text-align: right;">
        <a href="mailto:michael@clockworkops.co" style="color: var(--text-mid); text-decoration: none; display: block;">michael@clockworkops.co</a>
        <a href="tel:7203435580" style="color: var(--text-mid); text-decoration: none; display: block;">(720) 343-5580</a>
      </div>
    </footer>

    <script>
      // Smooth scroll for same-page anchors
      document.querySelectorAll('a[href^="#"]').forEach((a) => {
        a.addEventListener("click", (e) => {
          const target = document.querySelector(a.getAttribute("href"));
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: "smooth" });
          }
        });
      });

      // Subtle nav shadow on scroll
      const nav = document.querySelector("nav");
      window.addEventListener(
        "scroll",
        () => {
          nav.style.borderBottomColor =
            window.scrollY > 20
              ? "rgba(255,255,255,0.10)"
              : "rgba(255,255,255,0.06)";
        },
        { passive: true },
      );
    </script>
  </body>
</html>
